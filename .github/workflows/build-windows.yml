name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # публикация релиза

env:
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") { $v = $env:GITHUB_REF_NAME.Substring(1) }
          else { $v = "0.0.$env:GITHUB_RUN_NUMBER" }
          "APP_VERSION=$v" | Out-File -Append $env:GITHUB_ENV
          "Version: $v"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Download ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName .
          .\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Smoke test (screen capture on Windows)
        run: python tools/smoke_test.py

      - name: Build app (PyInstaller, onedir)
        run: >
          python -m PyInstaller --noconfirm --onedir --windowed --name InstantReplay
          --icon icon.ico --collect-data customtkinter --hidden-import pyaudiowpatch
          instant_replay.py

      - name: Add ffmpeg and notices
        run: Copy-Item ffmpeg.exe, LICENSE, THIRD_PARTY_NOTICES.md dist\InstantReplay\

      # ---------- установщик ----------
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DAppVersion=$env:APP_VERSION" installer\InstantReplay.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem Output

      - uses: actions/upload-artifact@v4
        with:
          name: InstantReplay-Setup
          path: Output/*.exe

      # ---------- релиз ----------
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/*.exe
          generate_release_notes: true
