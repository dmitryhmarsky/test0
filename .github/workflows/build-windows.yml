name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Download ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName .
          .\ffmpeg.exe -hide_banner -version | Select-Object -First 1
          .\ffmpeg.exe -hide_banner -filters | Select-String ddagrab

      - name: Smoke test (screen capture on Windows)
        continue-on-error: true
        run: python tools/smoke_test.py

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name InstantReplay
          --icon icon.ico --collect-data customtkinter --hidden-import pyaudiowpatch
          instant_replay.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory InstantReplay | Out-Null
          Copy-Item dist\InstantReplay.exe, ffmpeg.exe, README.md InstantReplay\

      - uses: actions/upload-artifact@v4
        with:
          name: InstantReplay-windows
          path: InstantReplay
