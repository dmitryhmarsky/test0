name: Build Windows

on:
  push:
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: windows-latest
    env:
      HAS_AZURE_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
      HAS_PFX_SIGNING: ${{ secrets.SIGN_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Download ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName .
          .\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Smoke test (screen capture on Windows)
        run: python tools/smoke_test.py

      - name: Build app (PyInstaller, onedir)
        run: >
          python -m PyInstaller --noconfirm --onedir --windowed --name InstantReplay
          --icon icon.ico --collect-data customtkinter --hidden-import pyaudiowpatch
          instant_replay.py

      - name: Add ffmpeg
        run: Copy-Item ffmpeg.exe dist\InstantReplay\

      # ---------- подпись (включается, когда в Secrets заданы данные сертификата) ----------
      - name: Sign app (Azure Artifact Signing)
        if: env.HAS_AZURE_SIGNING == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: dist\InstantReplay
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign app (PFX certificate)
        if: env.HAS_PFX_SIGNING == 'true'
        env:
          SIGN_PFX: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:SIGN_PFX))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -like "*x64*" | Select-Object -Last 1).FullName
          Get-ChildItem dist\InstantReplay -Recurse -Filter *.exe | ForEach-Object {
            & $signtool sign /f cert.pfx /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }
          "SIGNTOOL=$signtool" | Out-File -Append $env:GITHUB_ENV

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DAppVersion=$env:APP_VERSION" installer\InstantReplay.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem Output

      - name: Sign installer (Azure Artifact Signing)
        if: env.HAS_AZURE_SIGNING == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: Output
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign installer (PFX certificate)
        if: env.HAS_PFX_SIGNING == 'true'
        env:
          SIGN_PFX: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        shell: pwsh
        run: |
          Get-ChildItem Output -Filter *.exe | ForEach-Object {
            & $env:SIGNTOOL sign /f cert.pfx /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }
          Remove-Item cert.pfx

      - name: Check signature
        shell: pwsh
        run: Get-ChildItem Output -Filter *.exe | Get-AuthenticodeSignature | Format-List Path, Status, StatusMessage

      - uses: actions/upload-artifact@v4
        with:
          name: InstantReplay-Setup
          path: Output\*.exe
