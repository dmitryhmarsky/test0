name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # публикация релиза
  actions: read     # SignPath скачивает артефакты сборки

env:
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    env:
      # Подпись включается только для релизов (тег v*) и когда SignPath настроен
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") { $v = $env:GITHUB_REF_NAME.Substring(1) }
          else { $v = "0.0.$env:GITHUB_RUN_NUMBER" }
          "APP_VERSION=$v" | Out-File -Append $env:GITHUB_ENV
          "Version: $v"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Download ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName .
          .\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Smoke test (screen capture on Windows)
        run: python tools/smoke_test.py

      - name: Build app (PyInstaller, onedir)
        run: >
          python -m PyInstaller --noconfirm --onedir --windowed --name InstantReplay
          --icon icon.ico --collect-data customtkinter --hidden-import pyaudiowpatch
          instant_replay.py

      - name: Add ffmpeg and notices
        run: Copy-Item ffmpeg.exe, LICENSE, THIRD_PARTY_NOTICES.md dist\InstantReplay\

      # ---------- подпись программы (SignPath Foundation) ----------
      - name: Upload unsigned app
        if: env.SIGN == 'true'
        id: upload-app
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: dist/InstantReplay

      - name: Sign app
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'InstantReplay' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app

      - name: Use signed app
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          Copy-Item signed-app\* dist\InstantReplay\ -Recurse -Force
          Get-AuthenticodeSignature dist\InstantReplay\InstantReplay.exe | Format-List Status, SignerCertificate

      # ---------- установщик ----------
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DAppVersion=$env:APP_VERSION" installer\InstantReplay.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem Output

      - name: Upload unsigned installer
        id: upload-installer
        uses: actions/upload-artifact@v4
        with:
          name: InstantReplay-Setup${{ env.SIGN == 'true' && '-unsigned' || '' }}
          path: Output/*.exe

      - name: Sign installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'InstantReplay' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer

      - name: Collect final installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory release -Force | Out-Null
          $src = if ($env:SIGN -eq 'true') { "signed-installer" } else { "Output" }
          Copy-Item "$src\*.exe" release\
          Get-ChildItem release -Filter *.exe | Get-AuthenticodeSignature | Format-List Path, Status

      - name: Upload signed installer
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: InstantReplay-Setup
          path: release/*.exe

      # ---------- релиз ----------
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
